name: Article 6 check
on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  article-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main
      - name: Check identity, reach and quota (Articles 6.2, 6.3, 6.5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            python3 scripts/check_agent.py --pr ${{ github.event.pull_request.number }}
          else
            python3 scripts/check_agent.py --issue ${{ github.event.issue.number }}
          fi
      - name: Validate register and rebuild evidence map
        if: github.event_name == 'pull_request'
        run: |
          pip -q install jsonschema
          python3 scripts/build_evidence.py
          git diff --exit-code docs/EVIDENCE.md || { echo "docs/EVIDENCE.md is stale; run scripts/build_evidence.py"; exit 1; }
