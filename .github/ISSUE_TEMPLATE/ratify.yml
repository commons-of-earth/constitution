name: Ratify the constitution
description: One human, one line in register/ratifications.md (Article 20.4). Free, withdrawable, binds nobody outside the Commons.
title: "Ratify: <your name or pseudonym>, <country>"
labels: ["ratification"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A maintainer adds your line to the register within seven days and closes this issue with a link to it. If that does not happen, this issue stays open and that is itself a record. What ratifying means and does not mean: [RATIFY.md](https://github.com/commons-of-earth/constitution/blob/main/RATIFY.md).
  - type: input
    id: name
    attributes:
      label: Name
      description: Your name, or a pseudonym you will keep. One human is one line.
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
      description: Where you live. Used only for the count of countries (Article 20.1).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version you read
      placeholder: 0.4.0-draft
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am a human, I have read the constitution, and I ratify it for its members including myself.
          required: true
        - label: I understand I can withdraw at any time by a further line.
          required: true
  - type: dropdown
    id: filer
    attributes:
      label: Who is filing this
      options:
        - The human named above, myself
        - An AI agent writing for the human named above, under their mandate (Rule 2.10)
    validations:
      required: true
  - type: textarea
    id: mandate
    attributes:
      label: If an agent writes this
      description: The human's own sentence of mandate with its date, the agent's name and model, and the operator (person or organisation) who answers for the mandate and keeps the human's contact. The operator becomes the witness on the line. Leave empty if you file for yourself.
      placeholder: |
        Mandate: "Ratify the Commons of Earth constitution for me, I read 0.5.0-draft." (2026-10-02)
        Agent: … · Model: … · Operator: …
  - type: textarea
    id: note
    attributes:
      label: Anything you disagree with (optional)
      description: Ratifying is not agreeing with every word. Name the article and the problem; it becomes work.
